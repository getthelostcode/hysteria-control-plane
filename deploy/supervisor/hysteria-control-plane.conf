; Alternative to the systemd units (for hosts that use Supervisor).
; Place in /etc/supervisor/conf.d/hysteria-control-plane.conf and run:
;   supervisorctl reread && supervisorctl update

[program:hysteria-cp-horizon]
process_name=%(program_name)s
command=php /var/www/hysteria-control-plane/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hysteria-control-plane/storage/logs/horizon.log
stopwaitsecs=3600

[program:hysteria-cp-reverb]
command=php /var/www/hysteria-control-plane/artisan reverb:start --host=0.0.0.0 --port=8081
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hysteria-control-plane/storage/logs/reverb.log

[program:hysteria-cp-scheduler]
command=php /var/www/hysteria-control-plane/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/hysteria-control-plane/storage/logs/scheduler.log
